[project]
name = "ghosttab"
version = "0.2.0"
description = "Inline autocomplete, dictation and a selection assistant for Windows on a local llama.cpp server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "uiautomation==2.0.20",
    "requests>=2.31",
    "sounddevice==0.5.2",
    "numpy==2.2.6",
]

[project.scripts]
ghosttab = "ghosttab.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ghosttab"]
